name: tests

# What each job runs is in CONTRIBUTING.md ("What the CI runs"); every job is a command a
# contributor can run the same way on their own machine.
on:
  push:
  pull_request:

permissions:
  contents: read

# Every action is pinned to the commit its tag pointed at, with the tag in a comment: a tag can be
# moved, a commit cannot (docs/SUPPLY_CHAIN.md says how to move a pin; test_supply_chain.py checks).
# No job uses a secret, and actions/checkout keeps no token in the clone (persist-credentials).

jobs:
  # The server suite on SQLite, with the fuzz tests at their default, seeded, small size
  # (test_fuzz.py, test_security_fuzz.py; docs/security-review/FUZZING.md).
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (tag v4)
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0 (tag v5)
        with:
          python-version: "3.12"
      # The hash-pinned lock (tools/lock_requirements.sh), as the images install it.
      - run: pip install --require-hashes --no-deps -r server/requirements-pip.txt && pip install --require-hashes --no-deps -r server/requirements.txt
      - run: python -m pytest -q server/tests
        env:
          ATTACKLEDGER_HOME: ${{ github.workspace }}

  # The same suite on Postgres 16, as production runs, then the migration-0022 upgrade of a
  # database the 0.7.1 code filled: tools/test_postgres.sh, with the API image built from this
  # commit and the Postgres image docker-compose.yml pins by digest.
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (tag v4)
        with:
          persist-credentials: false
          fetch-depth: 0          # the upgrade check needs the 0.7.1 commit (tools/test_postgres.sh)
      - run: docker build -q -t attackledger-api:ci -f server/Dockerfile .
      - run: tools/test_postgres.sh
        env:
          ATTACKLEDGER_TEST_IMAGE: attackledger-api:ci

  # The browser verifier against tools/verify_report.py (D-046): every case, then a short run of
  # seeded random mutants (the same seed always makes the same mutants).
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (tag v4)
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0 (tag v5)
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0 (tag v4)
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: web
      - run: tools/verifier_equivalence/run.sh
      - run: tools/verifier_equivalence/run.sh --fuzz 500 --seed 20261010

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (tag v4)
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0 (tag v4)
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  # The browser end-to-end tests (docs/security-review/WEB_E2E.md): the public site as Cloudflare
  # Pages serves it, then the web app on its own stack (the API and web images built from this
  # commit), in Chromium, Firefox and WebKit, inside the Playwright image e2e/Dockerfile pins by
  # digest, on a Docker network with no route out. Every token and password is made for the run.
  # When a test fails, Playwright's HTML report and the failed tests' traces are uploaded (the
  # tokens in them were random for that run and died with its stack).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (tag v4)
        with:
          persist-credentials: false
      - run: tools/test_e2e.sh
        env:
          E2E_REPORT_DIR: ${{ runner.temp }}/e2e-report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: e2e-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-report
          retention-days: 7
          if-no-files-found: ignore

  # The workflows themselves: actionlint (pinned by digest) with shellcheck on every run: script.
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (tag v4)
        with:
          persist-credentials: false
      - run: tools/lint_workflows.sh

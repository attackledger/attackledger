name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The hash-pinned lock (tools/lock_requirements.sh), as the images install it.
      - run: pip install --require-hashes --no-deps -r server/requirements-pip.txt && pip install --require-hashes --no-deps -r server/requirements.txt
      - run: python -m pytest -q server/tests
        env:
          ATTACKLEDGER_HOME: ${{ github.workspace }}

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run lint
      - run: npm run build

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# Every action is pinned to the commit its tag pointed at, with the tag in a comment: a tag can be
# moved, a commit cannot (docs/SUPPLY_CHAIN.md says how to move a pin; test_supply_chain.py checks).

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (tag v4)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (tag v5)
        with:
          python-version: "3.12"
      # The hash-pinned lock (tools/lock_requirements.sh), as the images install it.
      - run: pip install --require-hashes --no-deps -r server/requirements-pip.txt && pip install --require-hashes --no-deps -r server/requirements.txt
      - run: python -m pytest -q server/tests
        env:
          ATTACKLEDGER_HOME: ${{ github.workspace }}

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (tag v4)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (tag v4)
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run lint
      - run: npm run build

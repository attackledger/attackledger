name: cla

# Every commit author of a pull request must sign CLA.md once (D-051). Signatures are stored
# in this repository, on the unprotected branch `cla-signatures`, so no external service or
# extra token is needed. pull_request_target runs this workflow from the base branch and never
# checks out the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    steps:
      - name: CLA Assistant Lite
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1, pinned by commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/attackledger/attackledger/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thank you for your contribution. AttackLedger is published under the AGPL-3.0 and
            also offered under a commercial licence, so we ask every contributor to sign our
            [Contributor License Agreement](https://github.com/attackledger/attackledger/blob/main/CLA.md)
            once. You keep the copyright in your work. To sign, reply to this pull request
            with the sentence below.

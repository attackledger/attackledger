# Weekly dependency update checks: one grouped pull request per kind of dependency, for releases
# at least two weeks old (the cooldown: the project's rule, docs/SUPPLY_CHAIN.md, "Changing a
# dependency"). Security updates come as soon as an advisory is published, without the cooldown
# ("Dependabot security updates" in the repository settings, on since D-048).
# Dependabot's pull requests run the tests workflow like any other, with a read-only token and no
# secrets; cla.yml lets dependabot[bot] through. How a maintainer finishes each kind of update (a
# Python bump needs a re-lock) is in docs/SUPPLY_CHAIN.md, "Dependabot".
version: 2
updates:
  # The .in files are what people edit; the hashed .txt locks are made from them by
  # tools/lock_requirements.sh. A Dependabot bump has to be re-locked by a maintainer:
  # server/tests/test_supply_chain.py fails until each lock matches its .in file.
  - package-ecosystem: pip
    directories: [/server, /worker, /tools/ci]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Etc/UTC }
    cooldown: { default-days: 14 }
    groups:
      python:
        patterns: ["*"]
    ignore:
      # 0.142.x sets up OpenTelemetry exporters from OTEL_* variables by default; 0.143 makes
      # it opt-in (docs/security-review/DEPENDABOT_2026-10-11.md, #8).
      - dependency-name: fastapi
        versions: ["0.142.x"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Etc/UTC }
    cooldown: { default-days: 14 }
    groups:
      npm-production:
        dependency-type: production
      dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5

  # The browser end-to-end suite (tools/test_e2e.sh): Playwright's version must match the
  # digest-pinned Playwright image in e2e/Dockerfile, so a Playwright bump moves both.
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Etc/UTC }
    cooldown: { default-days: 14 }
    groups:
      e2e:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # The digest-pinned FROM lines. The images run Python 3.12, which the locks are resolved for
  # (tools/lock_requirements.sh), and Node 24: a new Python minor or Node major is a decision of
  # its own, not a weekly bump.
  - package-ecosystem: docker
    directories: [/server, /worker, /web, /e2e]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Etc/UTC }
    cooldown: { default-days: 14 }
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # nginx: the project follows the stable branch (even minors); odd minors are mainline
      # (docs/security-review/DEPENDABOT_2026-10-11.md, #20 and #22).
      - dependency-name: nginx
        versions: ["1.31.x", "1.33.x", "1.35.x"]
    open-pull-requests-limit: 5

  # The digest-pinned compose `image:` lines (Postgres, nginx for the lab, Caddy). The weekly
  # security workflow's tools/refresh_pins.sh reports every pin as well, whichever files
  # Dependabot recognises as compose files.
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Etc/UTC }
    cooldown: { default-days: 14 }
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # nginx: the project follows the stable branch (even minors); odd minors are mainline
      # (docs/security-review/DEPENDABOT_2026-10-11.md, #20 and #22).
      - dependency-name: nginx
        versions: ["1.31.x", "1.33.x", "1.35.x"]
    open-pull-requests-limit: 5

  # The commit-pinned actions. Dependabot moves the SHA but not always the version in the comment
  # (#21 moved v4 to v7 and kept "v4.4.0"): tools/ci/action-pins.txt records each SHA's tag, and
  # test_supply_chain.py fails until the pin, its comment and that file agree.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Etc/UTC }
    cooldown: { default-days: 14 }
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

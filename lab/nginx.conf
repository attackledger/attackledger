# Local practice target for end-to-end checks. Answers as shop.lab.test inside
# the compose network only. The access log records the research identification,
# so tests can prove every request carried it, and which fictional user a request
# was signed in as (user="", alice or carol), never the session itself.
log_format withheaders '$server_port "$request" $status ua="$http_user_agent" research="$http_x_bug_bounty" t=$msec user="$lab_user"';

# ---- the sign-in (fictional) -----------------------------------------------------------------
# Two fictional accounts, for the Authentication, Session management and Authorization lanes
# (and the Cryptography, Client side and API lanes, below):
#   alice  password shop-alice-2026        role customer   order 1001
#   carol  password shop-carol-admin-2026  role admin      order 1002
# A person signs in through the lab proxy's browser (POST /login, docs/INSTALL.md section 19) and
# pastes the cookie into a test account (D-040); tools/agent_live.py does the same for its runs.
# The sign-in answers with a session cookie, lab_session, that names the account below. Each
# account has one fixed session, like a session table that never expires: nothing is stored, so
# the lab keeps no state and every write it accepts (sign-in, email, password) changes nothing.
#
# Planted, for the lanes that need a signed-in user (an agent sends read-only requests; the
# accounts' sessions are added by the gateway):
#   Authentication (athn)
#     - ATHN-01: credentials travel in clear: the lab has no HTTPS, and the form posts over HTTP.
#     - ATHN-06: signed-in pages say any cache may keep them (Cache-Control: public).
#     - ATHN-07: the password policy is four characters (the change form says so, minlength="4").
#     - ATHN-09: the password change does not ask for the current password.
#   Session management (sess)
#     - SESS-02: lab_session has no HttpOnly, Secure or SameSite attribute.
#     - SESS-04: the statement link carries the session in its URL (?session=...).
#     - SESS-05: the email change form has no anti-CSRF token (and the cookie no SameSite).
#     - SESS-06: sign-out clears the cookie in the browser only: the same session still works.
#     - SESS-07: the session lasts a year and is renewed on every signed-in page.
#   Authorization (athz)
#     - ATHZ-04 (IDOR): /api/v1/orders/<id> answers any signed-in user: alice reads carol's 1002.
#     - ATHZ-02/03: /admin/ refuses a customer (403), but the admin API it calls,
#       /api/v1/admin/users, checks only that someone is signed in: alice gets the user list.
# Not planted: session fixation, lockout, default credentials, traversal (they need writes,
# guessing or more state than a static lab has).
#
# Planted for the other lanes, each observable with read-only requests (an approved write only
# confirms IDNT-02). Their runs: idnt and busl signed out, cryp, clnt and apit signed in.
#   Identity management (idnt), from the sign-in page's links
#     - IDNT-04: the password reset (/forgot-password?username=) answers 200 and a masked email
#       for an existing account, 404 "No account uses that username" otherwise.
#     - IDNT-04/05: the registration's availability check (/api/v1/username-available?username=)
#       tells taken from free to anyone, and is case-sensitive while names are not policed:
#       "carol" is taken, "Carol" (or "carol " with a space) is free, so a look-alike can register.
#     - IDNT-02: the registration form sends the new account's role (hidden field role=customer)
#       and the server takes it: POST /register with role=admin answers "Account created with the
#       role admin" (nothing is stored).
#   Cryptography (cryp)
#     - CRYP-01/03: no TLS anywhere: port 8443 answers plain HTTP, and the sign-in, the session
#       and every signed-in page travel in clear (with ATHN-01).
#     - CRYP-04: the invoice share link on the account page, /invoice?ref=b3JkZXI9MTAwMQ==, is
#       base64 of "order=1001", neither encrypted nor signed: base64 of "order=1002" opens carol's
#       invoice, signed out too.
#     - CRYP-04: the data export (/account/export) carries the password hash: unsalted MD5
#       ("password_hash_algorithm":"md5").
#   Business logic (busl), from the cart (/cart and /static/cart.js)
#     - BUSL-01/05: the quantity check (/api/v1/cart/check?sku=SHOE-42&qty=) calls any whole
#       number valid: zero, negative, and above the stock (3) and the limit per order (5).
#     - BUSL-02/03: "Buy now" (/api/v1/checkout/quote?sku=SHOE-42&price=89.90) charges the price
#       the request carries: price=0.01, or a negative one, is "ready to pay", next to the list
#       price 89.90.
#   Client side (clnt)
#     - CLNT-01: /track writes location.hash into the page with innerHTML (/static/track.js):
#       /track#<img src=x onerror=alert(1)> runs script.
#     - CLNT-11: /support puts window messages from any origin, unchecked, into innerHTML
#       (/static/support.js).
#     - CLNT-07: /api/v1/me reflects any Origin in Access-Control-Allow-Origin, with
#       Access-Control-Allow-Credentials: true: any site can read the signed-in user's profile.
#     - CLNT-09: no page sends X-Frame-Options or a frame-ancestors policy, the signed-in password
#       change (/account/settings, ATHN-09) included: it can be framed (clickjacking).
#   API (apit): /graphql, queries over GET (?query=), named in /static/app.js
#     - APIT-01: introspection is on, signed out: a __schema or __type query answers with the
#       whole schema (a static lab: the same answer whatever the selection).
#     - APIT-01: customer(username:) answers any signed-in user with any customer's email, phone
#       and address: alice reads carol's.
#     - APIT-01: an unknown field's error suggests the real ones ("Did you mean customer, viewer
#       or orders?"), which gives the schema away even without introspection.
# Not planted: padding oracle, WebSockets, file uploads, process timing, rate limits (they need
# cryptography, a protocol or state a static nginx lab does not have).

# Which account a session cookie belongs to ("" when none).
map $cookie_lab_session $lab_user {
  default "";
  "5f1c0e7a9b3d4c26e8a1f0b7d2c9e4a3" alice;
  "9d2e7b4c1a6f3e80b5c2d9a7e4f1c036" carol;
}
map $lab_user $lab_role {
  default "";
  alice customer;
  carol admin;
}
map $lab_user $lab_name {
  default "";
  alice "Alice Example";
  carol "Carol Example";
}
map $lab_user $lab_order {
  default "";
  alice 1001;
  carol 1002;
}
map $lab_user $lab_greeting {
  default '<a href="/login">Sign in</a>';
  alice '<a href="/account/">Your account</a>';
  carol '<a href="/account/">Your account</a>';
}
# The sign-in form's body (read for POST /login only): the account whose username and password it
# carries, the fields in any order.
map $request_body $lab_login {
  default "";
  "~^(?=.*(?:^|&)username=alice(?:&|$))(?=.*(?:^|&)password=shop-alice-2026(?:&|$))" alice;
  "~^(?=.*(?:^|&)username=carol(?:&|$))(?=.*(?:^|&)password=shop-carol-admin-2026(?:&|$))" carol;
}
# The session the sign-in issues for each account: the same every time, never a new one.
map $http_x_lab_signed_in $lab_issue {
  default "";
  alice "5f1c0e7a9b3d4c26e8a1f0b7d2c9e4a3";
  carol "9d2e7b4c1a6f3e80b5c2d9a7e4f1c036";
}
map $lab_user $lab_email {
  default "";
  alice "alice@example.test";
  carol "carol@example.test";
}

# ---- identity management (idnt) ----
# An existing username, exactly (regular expressions: map's plain strings ignore case).
map $arg_username $lab_known {
  default "";
  "~^alice$" alice;
  "~^carol$" carol;
}
map $lab_known $lab_masked_email {
  default "";
  alice "a****@example.test";
  carol "c****@example.test";
}
# The role a registration form's body carries (read for POST /register only).
map $request_body $lab_register_role {
  default "customer";
  "~(?:^|&)role=([a-z]{1,16})(?:&|$)" $1;
}

# ---- cryptography (cryp) ----
# The invoice share link: base64 of "order=<id>" (CRYP-04), with its padding encoded or not.
map $lab_user $lab_invoice_ref {
  default "";
  alice "b3JkZXI9MTAwMQ==";
  carol "b3JkZXI9MTAwMg==";
}
map $arg_ref $lab_invoice {
  default "";
  "~^b3JkZXI9MTAwMQ(==|%3D%3D)?$" 1001;
  "~^b3JkZXI9MTAwMg(==|%3D%3D)?$" 1002;
}
# Unsalted MD5 of each fictional password (CRYP-04).
map $lab_user $lab_password_md5 {
  default "";
  alice "8ac41b85cd8011afadba933f4013def3";
  carol "9d9f49dd73efea99cfa7014456c44e54";
}

# ---- business logic (busl) ----
map $arg_sku $lab_list_price {
  default "";
  "~^SHOE-42$" "89.90";
  "~^GIFT-100$" "100.00";
}
# Any whole number, without leading zeros (BUSL-01/05: no bound is checked).
map $arg_qty $lab_qty {
  default "";
  "~^(-?)0*([0-9]{1,9})$" $1$2;
}
# A price as the request gives it (BUSL-02/03: taken instead of the list price).
map $arg_price $lab_price {
  default "";
  "~^(-?[0-9]{1,6}(?:\.[0-9]{1,2})?)$" $1;
}

# ---- API (apit) ----
# What a GraphQL query over GET asks for (the query is matched as sent, URL-encoded or not).
map $arg_query $lab_gql {
  default unknown;
  "~__schema|__type[^a-z]" introspection;
  "~customer" customer;
  "~viewer" viewer;
  "~orders" orders;
}
map $arg_query $lab_gql_customer {
  default "null";
  "~customer.*alice" '{"username":"alice","name":"Alice Example","email":"alice@example.test","phone":"+00 0000 1001","address":"1 Lab Street, Testville"}';
  "~customer.*carol" '{"username":"carol","name":"Carol Example","email":"carol@example.test","phone":"+00 0000 1002","address":"2 Lab Street, Testville"}';
}

server {
  listen 80;
  listen 8443;
  access_log /var/log/nginx/access.log withheaders;
  default_type text/html;

  location = / {
    return 200 '<html><head><title>Lab shop</title><script src="/static/app.js"></script></head>
<body><a href="/products?id=1">Products</a> <a href="/products?id=2">More</a>
<a href="/about">About</a> <a href="/search.php?q=shoes">Search</a> <a href="/account/logout">Sign out</a> <a href="/admin/">Admin</a>
<a href="/cart">Cart</a> <a href="/track">Track an order</a> <a href="/support">Help</a>
$lab_greeting</body></html>';
  }
  # Fictional values only: a real-shaped (but made up) AWS key id and a publishable key.
  location = /static/app.js {
    default_type application/javascript;
    return 200 'fetch("/api/v1/items?page=1"); fetch("/api/v1/cart");
const ORDERS = gql`query ListOrders { orders { id } }`;
const GRAPHQL = "/graphql";
const cfg = { awsKeyId: "AKIALABTARGETKEY0001", stripe: "pk_live_51LabShopPublishable" };
//# sourceMappingURL=app.js.map';
  }
  location = /static/app.js.map {
    default_type application/json;
    return 200 '{"version":3,"sources":["webpack:///src/api/client.ts","webpack:///src/admin/routes.ts"],"sourcesContent":["export const base = 1;","export const admin = 2;"],"mappings":""}';
  }
  # A deliberately exposed git config (fictional), for the scanner module to find.
  location = /.git/config {
    default_type text/plain;
    return 200 '[core]
	repositoryformatversion = 0
	bare = false
[remote "origin"]
	url = https://git.lab.test/shop/storefront.git
';
  }
  # The admin page checks the role: an admin gets it, a customer is refused, and without a
  # session it answers as it always did.
  location = /admin/ {
    if ($lab_role = admin) {
      return 200 '<html><head><title>Admin</title><script>fetch("/api/v1/admin/users")</script></head>
<body><h1>Admin</h1><p>Signed in as $lab_user ($lab_role).</p><a href="/api/v1/admin/users">Users</a></body></html>';
    }
    if ($lab_user != "") { return 403 '<html><head><title>Forbidden</title></head><body>admins only</body></html>'; }
    return 401 '<html><head><title>Admin Login</title></head><body>login</body></html>';
  }
  location /admin/ { return 401 '<html><head><title>Admin Login</title></head><body>login</body></html>'; }
  # Sign-out answers as it always did and clears the cookie in the browser, but nothing on the
  # server ends the session: the same cookie still signs in (SESS-06).
  location = /account/logout {
    add_header Set-Cookie "lab_session=; Path=/; Max-Age=0";
    return 200 'logged out';
  }

  # The sign-in form, over plain HTTP (ATHN-01). nginx reads a request body only for a proxied
  # request, so its POST goes to the loopback server at the end of this file, which answers.
  location = /login {
    if ($request_method = POST) { rewrite ^ /_signin last; }
    return 200 '<html><head><title>Sign in</title></head><body><h1>Sign in</h1>
<form method="post" action="http://shop.lab.test/login">
<label>Username <input name="username"></label>
<label>Password <input name="password" type="password"></label>
<button>Sign in</button></form>
<p><a href="/forgot-password">Forgot your password?</a> <a href="/register">Create an account</a></p></body></html>';
  }
  location = /_signin {
    internal;
    client_max_body_size 4k;
    client_body_buffer_size 4k;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Lab-Signed-In $lab_login;
    proxy_pass http://127.0.0.1:8081;
  }

  # Signed-in pages; 401 with a link to the sign-in without a session. Each renews the session
  # cookie for a year without HttpOnly, Secure or SameSite (SESS-02, SESS-07) and lets any cache
  # keep the page (ATHN-06).
  location = /account/ {
    if ($lab_user = "") { return 401 '<html><head><title>Sign in required</title></head><body><a href="/login">Sign in</a></body></html>'; }
    add_header Set-Cookie "lab_session=$cookie_lab_session; Path=/; Max-Age=31536000";
    add_header Cache-Control "public, max-age=3600";
    return 200 '<html><head><title>Your account</title></head><body><h1>Hello, $lab_name</h1>
<p>Signed in as $lab_user ($lab_role).</p>
<p><a href="/api/v1/orders">Your orders</a> (latest: <a href="/api/v1/orders/$lab_order">order $lab_order</a>)</p>
<p><a href="/account/statement?session=$cookie_lab_session">Download your statement</a></p>
<p><a href="/invoice?ref=$lab_invoice_ref">Share your latest invoice</a> <a href="/account/export">Export your data</a></p>
<p><a href="/account/settings">Settings</a> <a href="/account/logout">Sign out</a></p>
<form method="post" action="/account/email"><label>New email <input name="email"></label><button>Change email</button></form>
</body></html>';
  }
  # The password change asks for the new password only, at least four characters (ATHN-07, -09).
  location = /account/settings {
    if ($lab_user = "") { return 401 '<html><head><title>Sign in required</title></head><body><a href="/login">Sign in</a></body></html>'; }
    add_header Set-Cookie "lab_session=$cookie_lab_session; Path=/; Max-Age=31536000";
    add_header Cache-Control "public, max-age=3600";
    return 200 '<html><head><title>Settings</title></head><body><h1>Settings for $lab_user</h1>
<form method="post" action="/account/password">
<label>New password (at least 4 characters) <input name="new_password" type="password" minlength="4"></label>
<button>Change password</button></form></body></html>';
  }
  location = /account/statement {
    if ($lab_user = "") { return 401 '<html><head><title>Sign in required</title></head><body><a href="/login">Sign in</a></body></html>'; }
    add_header Set-Cookie "lab_session=$cookie_lab_session; Path=/; Max-Age=31536000";
    add_header Cache-Control "public, max-age=3600";
    default_type text/plain;
    return 200 'Statement for $lab_name: order $lab_order.\n';
  }
  # What the two forms send: accepted for a signed-in user, and nothing changes.
  location ~ ^/account/(email|password)$ {
    if ($lab_user = "") { return 401 'sign in first'; }
    return 200 'saved';
  }
  # The data export carries the password's unsalted MD5 (CRYP-04).
  location = /account/export {
    default_type application/json;
    if ($lab_user = "") { return 401 '{"error":"sign in first"}'; }
    add_header Set-Cookie "lab_session=$cookie_lab_session; Path=/; Max-Age=31536000";
    add_header Cache-Control "public, max-age=3600";
    return 200 '{"username":"$lab_user","name":"$lab_name","email":"$lab_email","role":"$lab_role","orders":[$lab_order],"password_hash":"$lab_password_md5","password_hash_algorithm":"md5"}';
  }

  # The shop's API for signed-in users. Any of them reads any order (ATHZ-04), and the admin API
  # checks only that someone is signed in, not the role (ATHZ-02, ATHZ-03).
  # Any Origin is reflected, with credentials (CLNT-07), signed in or not.
  location = /api/v1/me {
    default_type application/json;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    if ($lab_user = "") { return 401 '{"error":"sign in first"}'; }
    return 200 '{"username":"$lab_user","name":"$lab_name","email":"$lab_email","role":"$lab_role"}';
  }
  location = /api/v1/orders {
    default_type application/json;
    if ($lab_user = "") { return 401 '{"error":"sign in first"}'; }
    return 200 '{"orders":[{"id":$lab_order}]}';
  }
  location = /api/v1/orders/1001 {
    default_type application/json;
    if ($lab_user = "") { return 401 '{"error":"sign in first"}'; }
    return 200 '{"id":1001,"customer":"alice","name":"Alice Example","items":[{"sku":"SHOE-42","qty":1}],"total":"89.90 EUR","ship_to":"1 Lab Street, Testville"}';
  }
  location = /api/v1/orders/1002 {
    default_type application/json;
    if ($lab_user = "") { return 401 '{"error":"sign in first"}'; }
    return 200 '{"id":1002,"customer":"carol","name":"Carol Example","items":[{"sku":"GIFT-100","qty":1}],"total":"100.00 EUR","ship_to":"2 Lab Street, Testville"}';
  }
  location /api/v1/orders/ {
    default_type application/json;
    if ($lab_user = "") { return 401 '{"error":"sign in first"}'; }
    return 404 '{"error":"no such order"}';
  }
  location = /api/v1/admin/users {
    default_type application/json;
    if ($lab_user = "") { return 401 '{"error":"sign in first"}'; }
    return 200 '{"users":[{"username":"alice","role":"customer"},{"username":"carol","role":"admin"}]}';
  }

  # ---- identity management (idnt): reset, registration, availability ----
  # The reset tells an existing account from an unknown one (IDNT-04).
  location = /forgot-password {
    if ($arg_username = "") {
      return 200 '<html><head><title>Reset your password</title></head><body><h1>Reset your password</h1>
<form method="get" action="/forgot-password"><label>Username <input name="username"></label>
<button>Send a reset link</button></form></body></html>';
    }
    if ($lab_known = "") { return 404 '<html><head><title>Reset your password</title></head><body>No account uses that username.</body></html>'; }
    return 200 '<html><head><title>Reset your password</title></head><body>We have emailed a reset link to $lab_masked_email.</body></html>';
  }
  # The form sends the role (IDNT-02). Its POST goes to the loopback server, like the sign-in's.
  location = /register {
    if ($request_method = POST) { rewrite ^ /_register last; }
    return 200 '<html><head><title>Create an account</title><script src="/static/register.js"></script></head><body><h1>Create an account</h1>
<form method="post" action="/register">
<label>Username <input name="username" id="username"></label> <span id="taken"></span>
<label>Email <input name="email" type="email"></label>
<label>Password (at least 4 characters) <input name="password" type="password" minlength="4"></label>
<input type="hidden" name="role" value="customer">
<button>Create account</button></form></body></html>';
  }
  location = /_register {
    internal;
    client_max_body_size 4k;
    client_body_buffer_size 4k;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Lab-Register-Role $lab_register_role;
    proxy_pass http://127.0.0.1:8081;
  }
  location = /static/register.js {
    default_type application/javascript;
    return 200 'document.addEventListener("DOMContentLoaded", function () {
  var u = document.getElementById("username");
  u.addEventListener("change", function () {
    fetch("/api/v1/username-available?username=" + encodeURIComponent(u.value))
      .then(function (r) { return r.json(); })
      .then(function (j) { document.getElementById("taken").textContent = j.available ? "available" : "taken"; });
  });
});
';
  }
  # Anyone can ask; the match is exact and case-sensitive (IDNT-04/05).
  location = /api/v1/username-available {
    default_type application/json;
    if ($arg_username = "") { return 400 '{"error":"username is required"}'; }
    if ($lab_known != "") { return 200 '{"available":false}'; }
    return 200 '{"available":true}';
  }

  # ---- cryptography (cryp): the invoice share link (CRYP-04), no sign-in needed ----
  location = /invoice {
    default_type text/plain;
    if ($lab_invoice = 1001) { return 200 'Invoice for order 1001\nAlice Example, 1 Lab Street, Testville\n1 x SHOE-42  89.90 EUR\nTotal 89.90 EUR\n'; }
    if ($lab_invoice = 1002) { return 200 'Invoice for order 1002\nCarol Example, 2 Lab Street, Testville\n1 x GIFT-100  100.00 EUR\nTotal 100.00 EUR\n'; }
    return 404 'no such invoice';
  }

  # ---- business logic (busl): the cart, its quantity check and "Buy now" ----
  location = /cart {
    return 200 '<html><head><title>Your cart</title><script src="/static/cart.js"></script></head><body><h1>Your cart</h1>
<p>Running shoe (SHOE-42), 89.90 EUR. In stock: 3. At most 5 per order.</p>
<label>Quantity <input id="qty" name="qty" type="number" min="1" max="3" value="1"></label> <span id="check"></span>
<p><a href="/api/v1/checkout/quote?sku=SHOE-42&amp;price=89.90">Buy now</a></p></body></html>';
  }
  location = /static/cart.js {
    default_type application/javascript;
    return 200 'document.addEventListener("DOMContentLoaded", function () {
  var q = document.getElementById("qty");
  q.addEventListener("change", function () {
    fetch("/api/v1/cart/check?sku=SHOE-42&qty=" + encodeURIComponent(q.value))
      .then(function (r) { return r.json(); })
      .then(function (j) { document.getElementById("check").textContent = j.valid ? "ok" : j.error; });
  });
});
';
  }
  # Any whole number is valid (BUSL-01/05).
  location = /api/v1/cart/check {
    default_type application/json;
    if ($lab_list_price = "") { return 404 '{"valid":false,"error":"unknown sku"}'; }
    if ($lab_qty = "") { return 400 '{"valid":false,"error":"qty must be a whole number"}'; }
    return 200 '{"sku":"$arg_sku","qty":$lab_qty,"in_stock":3,"max_per_order":5,"valid":true}';
  }
  # The price is the request's, not the list's (BUSL-02/03).
  location = /api/v1/checkout/quote {
    default_type application/json;
    if ($lab_list_price = "") { return 404 '{"error":"unknown sku"}'; }
    if ($lab_price = "") { return 400 '{"error":"price must be a number such as 89.90"}'; }
    return 200 '{"sku":"$arg_sku","qty":1,"list_price":"$lab_list_price","unit_price":"$lab_price","total":"$lab_price EUR","status":"ready to pay"}';
  }

  # ---- client side (clnt): a DOM sink fed by the URL (CLNT-01), a message listener (CLNT-11) ----
  location = /track {
    return 200 '<html><head><title>Track an order</title></head><body><h1>Track an order</h1>
<p>Open the link in your shipping email: it ends with # and your order number.</p>
<div id="status"></div><script src="/static/track.js"></script></body></html>';
  }
  location = /static/track.js {
    default_type application/javascript;
    return 200 'var ref = decodeURIComponent(location.hash.slice(1));
if (ref) { document.getElementById("status").innerHTML = "Order <b>" + ref + "</b> is on its way."; }
';
  }
  location = /support {
    return 200 '<html><head><title>Help</title></head><body><h1>Help</h1>
<div id="chat">Our chat opens here.</div><script src="/static/support.js"></script></body></html>';
  }
  location = /static/support.js {
    default_type application/javascript;
    return 200 '// The chat widget runs on another site and sends its messages here.
window.addEventListener("message", function (e) {
  document.getElementById("chat").innerHTML = e.data;
});
';
  }

  # ---- API (apit): GraphQL over GET ----
  # Introspection for anyone (APIT-01); the fields for a signed-in user, and customer() for any
  # customer (APIT-01); an unknown field's error names the real ones (APIT-01).
  location = /graphql {
    default_type application/json;
    if ($arg_query = "") { return 400 '{"errors":[{"message":"Must provide query string."}]}'; }
    if ($lab_gql = introspection) {
      return 200 '{"data":{"__schema":{"queryType":{"name":"Query"},"mutationType":null,"types":[{"kind":"OBJECT","name":"Query","fields":[{"name":"viewer","args":[],"type":{"kind":"OBJECT","name":"Customer","ofType":null}},{"name":"customer","args":[{"name":"username","type":{"kind":"NON_NULL","name":null,"ofType":{"kind":"SCALAR","name":"String"}}}],"type":{"kind":"OBJECT","name":"Customer","ofType":null}},{"name":"orders","args":[],"type":{"kind":"LIST","name":null,"ofType":{"kind":"OBJECT","name":"Order"}}}]},{"kind":"OBJECT","name":"Customer","fields":[{"name":"username","args":[],"type":{"kind":"SCALAR","name":"String","ofType":null}},{"name":"name","args":[],"type":{"kind":"SCALAR","name":"String","ofType":null}},{"name":"email","args":[],"type":{"kind":"SCALAR","name":"String","ofType":null}},{"name":"phone","args":[],"type":{"kind":"SCALAR","name":"String","ofType":null}},{"name":"address","args":[],"type":{"kind":"SCALAR","name":"String","ofType":null}},{"name":"role","args":[],"type":{"kind":"SCALAR","name":"String","ofType":null}}]},{"kind":"OBJECT","name":"Order","fields":[{"name":"id","args":[],"type":{"kind":"SCALAR","name":"ID","ofType":null}},{"name":"total","args":[],"type":{"kind":"SCALAR","name":"String","ofType":null}}]},{"kind":"SCALAR","name":"String"},{"kind":"SCALAR","name":"ID"}]}}}';
    }
    if ($lab_gql = unknown) { return 400 '{"errors":[{"message":"Cannot query field on type Query. Did you mean customer, viewer or orders?"}]}'; }
    if ($lab_user = "") { return 200 '{"data":null,"errors":[{"message":"Not signed in","path":["$lab_gql"]}]}'; }
    if ($lab_gql = viewer) { return 200 '{"data":{"viewer":{"username":"$lab_user","name":"$lab_name","email":"$lab_email","role":"$lab_role"}}}'; }
    if ($lab_gql = orders) { return 200 '{"data":{"orders":[{"id":"$lab_order"}]}}'; }
    return 200 '{"data":{"customer":$lab_gql_customer}}';
  }

  # Known paths answer; everything else is a real 404, so content discovery has signal.
  location ~ ^/(about|products)$ { return 200 '<html><head><title>Lab page</title></head><body>ok</body></html>'; }
  # A dynamic endpoint with a hidden "debug" parameter that changes the response.
  location = /search.php {
    if ($arg_debug) { return 200 '<html><body>results for $arg_q (debug: verbose trace enabled)</body></html>'; }
    return 200 '<html><body>results for $arg_q</body></html>';
  }
  # A redirect off the host: tools must report it, never follow it (.invalid never resolves).
  location = /go { return 302 https://redirected.invalid/; }
  # A directory that redirects to its slash form: content discovery recurses into it.
  location = /docs { return 301 /docs/; }
  location /docs/ { return 200 'docs index'; }
  location = /robots.txt { default_type text/plain; return 200 'User-agent: *\nDisallow: /backup/\n'; }
  location /backup/ { return 200 'backup index'; }
  location /api/ { default_type application/json; return 200 '{"ok":true}'; }
  location / { return 404 'not found'; }
}

# The sign-in's answer, on the loopback only (the lab network cannot reach it), for the request
# logged above: the account's session cookie for a known username and password, a refusal
# otherwise.
server {
  listen 127.0.0.1:8081;
  access_log off;
  default_type text/html;
  # The registration's answer: the role the form sent is the account's (IDNT-02). Nothing is stored.
  location = /_register {
    return 200 '<html><head><title>Account created</title></head><body>Account created with the role $http_x_lab_register_role. <a href="/login">Sign in</a></body></html>';
  }
  location / {
    if ($lab_issue = "") {
      return 401 '<html><head><title>Sign in</title></head><body>Wrong username or password. <a href="/login">Try again</a></body></html>';
    }
    add_header Set-Cookie "lab_session=$lab_issue; Path=/";
    return 200 '<html><head><title>Signed in</title></head><body>Signed in. <a href="/account/">Your account</a></body></html>';
  }
}

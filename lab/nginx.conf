log_format withheaders '$remote_addr "$request" $status ua="$http_user_agent" research="$http_x_bug_bounty"';
server {
  listen 80;
  access_log /var/log/nginx/access.log withheaders;
  location / { default_type text/html; return 200 '<html><head><title>Lab shop</title></head><body>lab target</body></html>'; }
}

# The front of the second practice target, OWASP Juice Shop (D-060, docs/INSTALL.md section 19).
# Answers as juice.lab.test on port 80 inside the compose network only (the lab network, where the
# gateway reaches it), and forwards everything to the Juice Shop container, which listens on 3000 on
# a network of its own that only this front shares (juiceshop). Nothing is planted here: what there
# is to find is Juice Shop's own challenge list (/api/Challenges).
#
# Why a front at all: Juice Shop writes its access log to a file inside its container, so this log,
# in the same format as the shop's (lab/nginx.conf), is the independent count tools/agent_live.py
# compares with the gateway's log (every request, with the research header and the user agent). It
# also makes the target answer on port 80 like the shop, so the gateway, the pre-flight check and the
# agents' URLs treat both the same, and keeps Juice Shop itself off the network the gateway is on.
#
# The front adds and changes nothing in a request: no X-Forwarded-For, the Host and the client's
# headers as sent (some challenges read request headers).
log_format withheaders '$server_port "$request" $status ua="$http_user_agent" research="$http_x_bug_bounty" t=$msec user=""';

map $http_upgrade $juice_connection {
  default upgrade;
  ""      "";
}

server {
  listen 80;
  access_log /var/log/nginx/access.log withheaders;
  # Juice Shop takes uploads of up to about 200 kB (its own limit), and a larger one is a challenge.
  client_max_body_size 2m;

  # Docker's resolver, so a recreated Juice Shop container (a new address) is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $juice http://juiceshop:3000;

  location / {
    proxy_pass $juice;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # socket.io (Juice Shop's "challenge solved" notifications) upgrades to a WebSocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $juice_connection;
    proxy_read_timeout 60s;
  }
}

# Networks (D-039, D-042, docs/GATEWAY.md, docs/WORKER_API.md), each internal (no route out)
# unless said otherwise:
#   internal  the worker and the gateway only. The worker reaches nothing else: no database,
#             no API, no internet. Its channel to the API is the gateway's relay (port 8081,
#             /worker/* only), its traffic the gateway's proxy and resolver.
#   control   the gateway and the API (rules, request log, the relayed worker calls).
#   database  the database and the API only.
#   lab       the gateway and the local practice target only.
#   default   api (published port, timestamp authority), web and the gateway: the way out.
# Every request a recon tool or an agent sends leaves through the gateway, which enforces the
# engagement's scope, read-only methods, rate ceiling and identification, and logs it.
#
# Container hardening (docs/security-review/SUPPLY_CHAIN.md), on every service:
#   - no-new-privileges: no process gains privileges through a setuid binary or file capabilities;
#   - cap_drop ALL: no Linux capability, and none added back (Caddy, in the production file,
#     gets NET_BIND_SERVICE only). Ports below 1024 are bound without one: Docker sets
#     net.ipv4.ip_unprivileged_port_start=0 in each container, and the services that bind one
#     say so explicitly with the same sysctl;
#   - a read-only root filesystem: each service writes only to its volumes and to the tmpfs
#     folders it lists, which are empty at every start;
#   - a non-root user (Postgres 70, the API 10001, the gateway 10002, the worker 10001,
#     nginx 101);
#   - a memory and a process (pids) ceiling, generous for one install. The production file
#     sets its own memory ceilings from .env.
# Images are pinned by digest; the build pins and hashes what it downloads (docs/SUPPLY_CHAIN.md).
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true

services:
  db:
    # postgres:16.15-alpine, pinned by its multi-arch index digest on 2026-10-10.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    <<: *hardening
    # The image's own postgres user, which owns the data folder: the entrypoint then needs no
    # root (no chown, no su-exec), so no capability either. A data volume made by an earlier
    # release is already owned by it (the entrypoint chowned it then).
    user: "70:70"
    tmpfs:
      - /var/run/postgresql:size=1m,mode=0775,uid=70,gid=70,noexec,nosuid,nodev
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    shm_size: 128m
    deploy:
      resources:
        limits:
          pids: 512
          memory: 2g
    environment:
      POSTGRES_DB: attackledger
      POSTGRES_USER: attackledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attackledger"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://attackledger:${POSTGRES_PASSWORD:-change-me}@db:5432/attackledger
      # Set to require a token on every API call (strongly recommended beyond localhost).
      ATTACKLEDGER_API_TOKEN: ${ATTACKLEDGER_API_TOKEN:-}
      # "1" when ANTHROPIC_API_KEY is set. The key itself is passed to the gateway only.
      ATTACKLEDGER_AGENTS_ENABLED: ${ANTHROPIC_API_KEY:+1}
      # "1" behind HTTPS, so session cookies are only sent over it.
      ATTACKLEDGER_COOKIE_SECURE: ${ATTACKLEDGER_COOKIE_SECURE:-}
      # RFC 3161 timestamp authority for receipts (D-034). Only a SHA-256 hash is sent, once
      # per closed lane. Set ATTACKLEDGER_TSA_URL=off to send nothing and skip timestamps.
      ATTACKLEDGER_TSA_URL: ${ATTACKLEDGER_TSA_URL:-http://timestamp.digicert.com}
      # Master key for encryption at rest (D-043, docs/ENCRYPTION.md). Required: without one the
      # API refuses to start (the worker holds no key: the API encrypts what the worker sends). Make one with
      #   docker compose run --rm --no-deps api python -m app.vault generate
      # and put ATTACKLEDGER_MASTER_KEY=... in .env, or mount a file and set ATTACKLEDGER_MASTER_KEY_FILE
      # to its path inside the container. Keep a copy apart from the backups. ATTACKLEDGER_DEV_KEY=1
      # uses a public development key instead: for a local trial with fictional data only.
      ATTACKLEDGER_MASTER_KEY_FILE: ${ATTACKLEDGER_MASTER_KEY_FILE:-}
      ATTACKLEDGER_MASTER_KEY: ${ATTACKLEDGER_MASTER_KEY:-}
      ATTACKLEDGER_DEV_KEY: ${ATTACKLEDGER_DEV_KEY:-}
    volumes:
      - blobs:/data/blobs
      - gateway-control:/data/gateway-control:ro   # the gateway's token, for its routes only
      - worker-control:/data/worker-control:ro     # the worker's token, for its routes only (D-042)
    # One alias per network the gateway shares with it: Docker answers "api" with one address
    # only, and the gateway refuses every address of the deployment's own containers by name
    # (gateway.DENY_HOSTS).
    networks:
      database: {}
      control:
        aliases: [api-control]
      default:
        aliases: [api-default]
    ports:
      - "127.0.0.1:8000:8000"
    <<: *hardening
    # USER 10001 in server/Dockerfile.
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          pids: 512
          memory: 1g
    depends_on:
      db:
        condition: service_healthy

  # The only way out for the worker (D-039). Same image as the API, its own user and command.
  # It creates its CA (private volume; the certificate goes to gateway-public for the worker)
  # and the token it uses on the API's gateway routes (gateway-control, shared with the API).
  gateway:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["python", "-u", "-m", "app.gateway"]
    user: "10002:10002"
    <<: *hardening
    # It binds the resolver on port 53 as uid 10002: allowed by this sysctl, not by a capability.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # Its per-host certificates (tempfile.mkdtemp) live here; the CA is on its volume.
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          pids: 512
          memory: 512m
    environment:
      ATTACKLEDGER_API_URL: http://api:8000
      # Extra passive-source hosts (comma-separated), for sources configured with your own keys.
      ATTACKLEDGER_GATEWAY_PASSIVE_HOSTS: ${ATTACKLEDGER_GATEWAY_PASSIVE_HOSTS:-}
      # Optional: enables Claude agents on hunt lanes. Put it in .env, never in this file. The
      # gateway adds it to the agent's Claude API calls; the worker never sees it (D-042).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The proxy, the resolver and the worker's relay answer on the worker's network only (the
      # gateway's alias there), not on the control, default and lab networks.
      ATTACKLEDGER_GATEWAY_LISTEN: gateway-internal
      # The subnets of the gateway's own networks are never contacted (the Docker host has an
      # address on each), except the network that holds targets: the lab's, named by the
      # gateway's alias on it. A real internal target is never in those subnets: they are routed
      # to Docker, not to the customer's network.
      ATTACKLEDGER_GATEWAY_TARGET_NETWORKS: gateway-lab
    volumes:
      - gateway-private:/data/gateway
      - gateway-public:/data/gateway-public
      - gateway-control:/data/gateway-control
    networks:
      internal:
        aliases: [gateway-internal]
      control: {}
      default: {}
      lab:
        aliases: [gateway-lab]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2)"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # No database URL, master key, blob store or Anthropic key (D-042): the API stores and
    # encrypts what the worker sends, and the gateway holds the Claude API key.
    environment:
      # Every tool and the agent go through the gateway: its proxy, its resolver, its CA.
      ATTACKLEDGER_GATEWAY: gateway:8080
      ATTACKLEDGER_GATEWAY_DNS: gateway:53
      ATTACKLEDGER_GATEWAY_CA: /data/gateway-public/ca.pem
      # The worker's channel to the API: the gateway's relay, which forwards /worker/* only.
      ATTACKLEDGER_WORKER_API: http://gateway:8081
      # claude-opus-5-5 (default), claude-sonnet-5-5 or claude-haiku-5-5 (cheaper, for a first test).
      ATTACKLEDGER_AGENT_MODEL: ${ATTACKLEDGER_AGENT_MODEL:-}
    volumes:
      - worker-control:/data/worker-control       # its token for the API, made on first start
      - gateway-public:/data/gateway-public:ro
    # No route out, and no other container but the gateway on its network. Docker does not
    # forward outside DNS questions for such containers; this unroutable resolver (TEST-NET-1)
    # keeps it so on engines that would.
    networks: [internal]
    dns: [192.0.2.1]
    <<: *hardening
    # USER worker (10001) in worker/Dockerfile. The tools write their settings under $HOME and
    # their working files under /tmp, both emptied at each start; the tools themselves are in
    # /opt (read-only), so /tmp is noexec.
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
      - /var/lib/worker:size=64m,mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev
    # The recon tools are Go programs with many threads each; every thread counts in pids.
    deploy:
      resources:
        limits:
          pids: 2048
          memory: 4g
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # Local practice target. Reachable only from the gateway, as shop.lab.test.
  lab:
    # nginx:1.30.5-alpine, pinned by its multi-arch index digest on 2026-10-10.
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    volumes:
      - ./lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    <<: *hardening
    user: "101:101"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0700,uid=101,gid=101,noexec,nosuid,nodev
      - /run:size=1m,mode=0755,uid=101,gid=101,noexec,nosuid,nodev
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          pids: 256
          memory: 128m
    networks:
      lab:
        aliases: [shop.lab.test]

  web:
    build:
      context: web
    ports:
      - "127.0.0.1:8080:80"
    <<: *hardening
    # nginx as its own unprivileged user (101): the master process too, so no capability is
    # needed to switch users. Port 80 through the sysctl, like the gateway's port 53.
    user: "101:101"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # Request bodies over 16 KB wait in /var/cache/nginx until the API takes them (an evidence
    # import is up to 50 MB per file): its tmpfs is sized for a few at once, and it counts
    # towards the memory ceiling.
    tmpfs:
      - /var/cache/nginx:size=256m,mode=0700,uid=101,gid=101,noexec,nosuid,nodev
      - /run:size=1m,mode=0755,uid=101,gid=101,noexec,nosuid,nodev
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          pids: 256
          memory: 512m
    depends_on:
      - api

networks:
  internal:
    internal: true
    driver_opts: &no-host-address
      # The Docker host gets no address on this network: a container here (the worker) cannot
      # reach a service the host runs on all interfaces (security review GW-8).
      com.docker.network.bridge.inhibit_ipv4: "true"
  control:
    internal: true
    driver_opts: *no-host-address
  database:
    internal: true
    driver_opts: *no-host-address
  lab:
    internal: true
    driver_opts: *no-host-address
  default: {}

volumes:
  dbdata:
  blobs:     # raw evidence (agent HTTP exchanges, notes, files), encrypted per engagement, with the wrapped keys
  gateway-private:   # the gateway's CA key: mounted by the gateway only
  gateway-public:    # the gateway's CA certificate, read by the worker
  gateway-control:   # the gateway's token for the API's gateway routes
  worker-control:    # the worker's token for the API's worker routes (D-042)

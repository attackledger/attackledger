services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attackledger
      POSTGRES_USER: attackledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attackledger"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://attackledger:${POSTGRES_PASSWORD:-change-me}@db:5432/attackledger
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://attackledger:${POSTGRES_PASSWORD:-change-me}@db:5432/attackledger
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Local practice target. Reachable only inside the compose network as shop.lab.test.
  lab:
    image: nginx:1.27-alpine
    volumes:
      - ./lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases: [shop.lab.test]

  web:
    build:
      context: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  dbdata:

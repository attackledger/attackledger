# Benchmark stack: AttackLedger against OWASP Juice Shop (docs/BENCHMARK.md).
#
#   docker compose -f docker-compose.yml -f tools/benchmark/compose.override.yml \
#     up -d db api gateway worker juice juice-proxy
#   python3 tools/benchmark/run.py            # recon run, measurement, results JSON
#   docker compose -f docker-compose.yml -f tools/benchmark/compose.override.yml down -v
#
# Isolation:
#   - its own project (attackledger-bench), database and volumes; the main stack
#     (attackledger-*) and the demo stack (attackledger-demo-*) are never touched;
#   - every network is internal: nothing here can reach the internet, and nothing outside this
#     machine can reach it. Only the API is also attached to a second network, to publish
#     127.0.0.1:8099 (no timestamp authority: TSA is off);
#   - the worker is on the internal network only (db, api, gateway). Juice Shop is on the lab
#     network, which only the gateway joins (D-039): every request the tools and the agent send
#     goes through the gateway, as in the main stack. The gateway has no egress network here;
#   - Juice Shop's port is not published. On the lab network it answers as juice.lab.test:3000
#     through juice-proxy, a byte-for-byte TCP relay that logs every request head, downstream of
#     the gateway, so each request can be counted and checked independently of the gateway's
#     own log for the methods, the identification and the rate limit.
#
# Images: the API and worker images are the main stack's images retagged by run.py
# (attackledger-bench-*), so they are never rebuilt here; the gateway runs the API image.
# Juice Shop is pinned by digest.
name: attackledger-bench

services:
  db:
    networks: !override [internal]
  api:
    image: attackledger-bench-api:latest
    build: !reset null
    pull_policy: never
    ports: !override ["127.0.0.1:8099:8000"]
    environment:
      ATTACKLEDGER_TSA_URL: "off"
      ATTACKLEDGER_DEV_KEY: "1"     # lab data only: the public development key (docs/ENCRYPTION.md)
    networks: !override [internal, front]
  gateway:
    image: attackledger-bench-api:latest
    build: !reset null
    pull_policy: never
    networks: !override [internal, lab]
  worker:
    image: attackledger-bench-worker:latest
    build: !reset null
    pull_policy: never
    environment:
      ATTACKLEDGER_DEV_KEY: "1"
    networks: !override [internal]
  # Not used by the benchmark; kept off the run (start only the services listed above).
  lab:
    networks: !override
      lab:
        aliases: [shop.lab.test]

  juice:
    # OWASP Juice Shop v20.2.0 (published 2026-08-10), pinned by its image index digest.
    image: bkimminich/juice-shop:v20.2.0@sha256:8739101ade29358abb5469ee66ae78e582c97ed0a5543a4ad102e5fa5193526b
    pull_policy: missing
    networks: !override [lab]

  juice-proxy:
    image: attackledger-bench-worker:latest
    pull_policy: never
    user: "10001"
    entrypoint: ["python", "-u", "/bench/countproxy.py"]
    command: ["--listen", "3000", "--upstream", "juice:3000", "--log", "/tmp/requests.jsonl"]
    volumes:
      - ./tools/benchmark/countproxy.py:/bench/countproxy.py:ro
    depends_on: [juice]
    networks: !override
      lab:
        aliases: [juice.lab.test]

networks:
  default:
    internal: true
  internal:
    internal: true
  lab:
    internal: true
  front: {}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the api service per request so a recreated api container is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    # nginx refuses bodies over 1 MB by default; evidence imports are up to 50 MB per file
    # (docs/IMPORT.md). The API enforces its own limits.
    client_max_body_size 60m;
  }

  location / {
    try_files $uri /index.html;
  }
}

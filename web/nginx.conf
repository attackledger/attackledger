server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Resolve the api service per request so a recreated api container is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    # nginx refuses bodies over 1 MB by default; evidence imports are up to 50 MB per file
    # (docs/IMPORT.md). The API enforces its own limits.
    client_max_body_size 60m;
    # No Content-Security-Policy here: the API sets its own on the pages it serves (the
    # report, the docs, raw evidence), and a second policy would be added on top of it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }

  # The app: everything from this origin, no inline script but the theme line in index.html
  # (by hash), no other origin at all.
  # - script-src: the bundle, and the theme script in index.html. Its hash must match the
  #   script's text exactly; server/tests/test_web_headers.py checks it.
  # - style-src: the bundle's stylesheet only. React sets style properties through the DOM,
  #   which a policy does not block. The printable report opens from /api/ under the API's
  #   own policy (the srcdoc frame in Report.tsx is used by the static demo only).
  # - connect-src: the API under /api/ and the bundled files only.
  # Keep add_header lines in this block: nginx drops the server-level ones in a location
  # that has its own. deploy/Caddyfile sets HSTS, which needs HTTPS.
  location / {
    try_files $uri /index.html;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-UrXTevb7Aq9PDgczqayOX/Eyq4RhoFY5kqndFLthSGs='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }
}

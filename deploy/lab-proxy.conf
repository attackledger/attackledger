# The lab proxy (deploy/compose.prod.yml, --profile lab): a browser's way to the practice target,
# and to nothing else. A file rather than inline content in the compose file: Compose writes
# inline content into the container, which a read-only root filesystem refuses.
server {
  listen 3128;
  # Docker's resolver, asked at request time, so a restarted lab is found again.
  resolver 127.0.0.11 valid=10s;
  set $lab shop.lab.test;
  if ($host != "shop.lab.test") { return 403 "This proxy reaches shop.lab.test only.\n"; }
  location / {
    proxy_pass http://$lab;
    proxy_set_header Host shop.lab.test;
    proxy_http_version 1.1;
  }
}
